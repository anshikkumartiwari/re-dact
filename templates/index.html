<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/logo.png') }}">
    <title>Redaction Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo" class="logo">
        </div>
        <h1 class="title">REDACTION TOOL</h1>
        <div class="vit-logo-container">
            <img src="{{ url_for('static', filename='assets/vit3.png') }}" alt="VIT Logo" class="vit-logo">
        </div>
    </header>
    
    <div class="container">
        <button id="show-decrypt-btn" class="submit-btn" style="margin-bottom: 20px;">Decrypt Redacted Document</button>
        <form id="redaction-form" action="/upload" method="post" enctype="multipart/form-data" class="redaction-form">
            <div class="form-group">
                <label for="file" class="input-label">Choose file:</label>
                <input type="file" id="file" name="file" class="file-input" required>
            </div>

            <div class="form-group checkbox-group">
                <label for="doc_check" class="input-label"><i class="fas fa-file-alt"></i> Is it a document?</label>
                <input type="checkbox" id="doc_check" name="doc_check" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_ocr" class="input-label"><i class="fas fa-eye-slash"></i> Redact text using OCR</label>
                <input type="checkbox" id="redact_ocr" name="redact_ocr" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_meta" class="input-label"><i class="fas fa-database"></i> Redact Metadata</label>
                <input type="checkbox" id="redact_meta" name="redact_meta" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_face" class="input-label"><i class="fas fa-user-secret"></i> Redact Face</label>
                <input type="checkbox" id="redact_face" name="redact_face" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_license_plate" class="input-label"><i class="fas fa-car"></i> Redact License Plate</label>
                <input type="checkbox" id="redact_license_plate" name="redact_license_plate" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_signature" class="input-label"><i class="fas fa-pen"></i> Redact Signature</label>
                <input type="checkbox" id="redact_signature" name="redact_signature" class="checkbox-input">
            </div>

            <div class="form-group checkbox-group">
                <label for="redact_nsfw" class="input-label"><i class="fas fa-exclamation-circle"></i> Redact NSFW Content</label>
                <input type="checkbox" id="redact_nsfw" name="redact_nsfw" class="checkbox-input">
            </div>
            
            <div class="form-group">
                <input type="submit" value="Redact" class="submit-btn">
            </div>
        </form>
        <form id="decryption-form" action="/decrypt" method="post" enctype="multipart/form-data" class="redaction-form" style="display:none;">
            <div class="form-group">
                <label for="encrypted_file" class="input-label">Upload Redacted File (DOCX/Image):</label>
                <input type="file" id="encrypted_file" name="encrypted_file" class="file-input" accept=".docx,.png,.jpg,.jpeg" required>
            </div>
            <div class="form-group">
                <label for="json_file" class="input-label">Upload Detection Log (JSON):</label>
                <input type="file" id="json_file" name="json_file" class="file-input" accept=".json" required>
            </div>
            <div class="form-group">
                <label for="secret_key" class="input-label">Enter Secret Key:</label>
                <input type="text" id="secret_key" name="secret_key" class="file-input" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Decrypt" class="submit-btn">
            </div>
        </form>
    </div>
    <script>
        document.getElementById('show-decrypt-btn').onclick = function() {
            document.getElementById('redaction-form').style.display = 'none';
            document.getElementById('decryption-form').style.display = 'block';
            this.style.display = 'none';
            return false;
        };
    </script>

    <footer class="footer">
        <p>&copy; 2025 Text Redaction Tool. All rights reserved.</p>
    </footer>
</body>
</html>
